<footer id="pp-legal-footer" class="mt-14 border-t border-slate-800/80 pt-6 pb-8 text-xs text-slate-400">
  <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4">
    <span id="pp-legal-copy" class="font-medium text-slate-400">© 2026 ProPlaza.</span>

    <button
      type="button"
      id="pp-legal-tab-btn"
      aria-expanded="false"
      aria-controls="pp-legal-drawer"
      class="inline-flex items-center gap-2 rounded-lg border border-slate-700/80 bg-slate-900/80 px-3 py-1.5 font-medium text-slate-200 transition hover:border-cyan-500/60 hover:text-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-500/40"
    >
      <span id="pp-legal-tab-label">Aviso legal y datos</span>
      <span id="pp-legal-tab-icon" aria-hidden="true" class="text-[11px] opacity-80">▼</span>
    </button>
  </div>

  <div
    id="pp-legal-drawer"
    role="region"
    aria-labelledby="pp-legal-panel-title"
    hidden
    class="mx-auto mt-3 max-w-5xl px-4"
  >
    <div class="rounded-xl border border-slate-800 bg-slate-900/95 p-4 text-left leading-relaxed text-slate-300 shadow-lg space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <span id="pp-legal-panel-title" class="text-[11px] font-semibold uppercase tracking-wider text-cyan-400">
          Marco técnico, privacidad y alcance
        </span>
        <button
          type="button"
          id="pp-legal-close-btn"
          aria-label="Cerrar aviso legal"
          class="text-[11px] font-medium text-slate-400 hover:text-white"
        >
          Cerrar ✕
        </button>
      </div>

      <p id="pp-legal-privacy" class="text-xs text-slate-300"></p>
      <p id="pp-legal-scope" class="text-xs text-slate-300"></p>
      <p id="pp-legal-summary-note" class="text-[11px] text-slate-400"></p>
    </div>
  </div>
</footer>

<script>
(function () {
  const I18N = {
    es: {
      copy: "© 2026 ProPlaza. Vitrina independiente de micro-apps.",
      tabLabel: "Aviso legal y datos",
      panelTitle: "Marco técnico, privacidad y alcance",
      closeBtn: "Cerrar ✕",
      closeAria: "Cerrar aviso legal",
      privacy:
        "<strong>Privacidad y tratamiento de datos:</strong> ProPlaza opera como vitrina sin cuentas de usuario ni base de datos propia de visitantes declarada. Las métricas de visitas se gestionan mediante <strong>GoatCounter</strong> conforme a su configuración activa. Si envías el formulario de postulación, los datos ingresados (nombre, correo, app, nicho y descripción del problema) se transmiten a través de <strong>Activepieces</strong> para revisar y gestionar la solicitud; el flujo configurado o los servicios externos involucrados pueden procesar o conservar dichos datos según su configuración y políticas, sin que ProPlaza los publique abiertamente en el catálogo ni los comercialice.",
      scope:
        "<strong>Descargo de responsabilidad y relación con creadores:</strong> ProPlaza ofrece un espacio de exhibición informativo bajo un esquema <em>&ldquo;tal cual&rdquo;</em> (<em>as-is</em>), sin garantías implícitas ni asesoría legal, contable, fiscal o financiera, y no garantiza que las aplicaciones de terceros estén disponibles, funcionen de forma ininterrumpida o produzcan determinados resultados. Cada creador administra su propio producto, define sus condiciones comerciales, responde por su funcionamiento, soporte y políticas, y gestiona directamente los acuerdos y pagos con los compradores. <strong>ProPlaza no procesa los pagos de los compradores.</strong>",
      summaryNote:
        "Este panel constituye un aviso resumido y no sustituye una política de privacidad completa ni unos términos y condiciones independientes."
    },
    en: {
      copy: "© 2026 ProPlaza. Independent micro-apps showcase.",
      tabLabel: "Legal & Data Notice",
      panelTitle: "Technical Scope, Privacy & Disclaimer",
      closeBtn: "Close ✕",
      closeAria: "Close legal notice",
      privacy:
        "<strong>Privacy & Data Handling:</strong> ProPlaza operates as a showcase without user accounts or a declared proprietary visitor database. Visit metrics are handled via <strong>GoatCounter</strong> according to its active configuration. If you submit the application form, the entered details (name, email, app, niche, and problem description) are routed through <strong>Activepieces</strong> to review and process the submission; the configured workflow or external services involved may process or retain such data under their own setup and policies, while ProPlaza neither publicly lists submissions in the catalog nor sells user data.",
      scope:
        "<strong>Disclaimer & Creator Relationship:</strong> ProPlaza provides an informational showcase on an <em>&ldquo;as-is&rdquo;</em> basis without implied warranties or legal, accounting, tax, or financial advice, and does not guarantee that third-party applications will remain available, operate continuously, or achieve specific results. Each creator manages their own product, sets their commercial terms, is responsible for their tool's operation, support, and policies, and handles agreements and payments directly with buyers. <strong>ProPlaza does not process buyer payments.</strong>",
      summaryNote:
        "This panel is a summary notice and does not replace a full privacy policy or standalone terms and conditions."
    }
  };

  function detectLang() {
    if (window.lang === "en" || window.currentLang === "en") return "en";
    const docLang = (document.documentElement.getAttribute("lang") || "").toLowerCase();
    return docLang.startsWith("en") ? "en" : "es";
  }

  function applyLang() {
    const lang = detectLang();
    const t = I18N[lang];

    const copyEl = document.getElementById("pp-legal-copy");
    const tabLabelEl = document.getElementById("pp-legal-tab-label");
    const panelTitleEl = document.getElementById("pp-legal-panel-title");
    const closeBtnEl = document.getElementById("pp-legal-close-btn");
    const privacyEl = document.getElementById("pp-legal-privacy");
    const scopeEl = document.getElementById("pp-legal-scope");
    const summaryNoteEl = document.getElementById("pp-legal-summary-note");

    if (copyEl) copyEl.textContent = t.copy;
    if (tabLabelEl) tabLabelEl.textContent = t.tabLabel;
    if (panelTitleEl) panelTitleEl.textContent = t.panelTitle;
    if (closeBtnEl) {
      closeBtnEl.textContent = t.closeBtn;
      closeBtnEl.setAttribute("aria-label", t.closeAria);
    }
    if (privacyEl) privacyEl.innerHTML = t.privacy;
    if (scopeEl) scopeEl.innerHTML = t.scope;
    if (summaryNoteEl) summaryNoteEl.textContent = t.summaryNote;
  }

  function isDrawerOpen() {
    const drawer = document.getElementById("pp-legal-drawer");
    return Boolean(drawer && !drawer.hidden);
  }

  function setDrawerOpen(open) {
    const drawer = document.getElementById("pp-legal-drawer");
    const btn = document.getElementById("pp-legal-tab-btn");
    const icon = document.getElementById("pp-legal-tab-icon");
    if (!drawer || !btn) return;

    drawer.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
    if (icon) icon.textContent = open ? "▲" : "▼";
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest("#pp-legal-tab-btn")) {
      setDrawerOpen(!isDrawerOpen());
    } else if (e.target.closest("#pp-legal-close-btn")) {
      setDrawerOpen(false);
    } else if (e.target.closest("#langBtn, .lang-btn, [data-lang-toggle]")) {
      setTimeout(applyLang, 0);
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && isDrawerOpen()) {
      setDrawerOpen(false);
      const btn = document.getElementById("pp-legal-tab-btn");
      if (btn) btn.focus();
    }
  });

  const htmlObserver = new MutationObserver(applyLang);
  htmlObserver.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["lang"]
  });

  function cleanupObserver() {
    htmlObserver.disconnect();
  }

  window.addEventListener("pagehide", cleanupObserver, { once: true });
  window.addEventListener("beforeunload", cleanupObserver, { once: true });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", applyLang, { once: true });
  } else {
    applyLang();
  }
})();
</script>
